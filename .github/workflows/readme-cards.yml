name: README cards

on:
  schedule:
    - cron: "17 3 * * *"   # ogni notte alle 03:17 UTC
  workflow_dispatch:         # pulsante "Run workflow" per lanciarla a mano
  push:
    paths:
      - "scripts/**"
      - "data/avatar.txt"

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Scarica i contributi e rigenera le card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py --fetch

      - name: Commit se qualcosa è cambiato
        run: |
          git add data/contributions.json assets/*.svg
          if git diff --cached --quiet; then
            echo "Niente da aggiornare"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh README cards"
          git pull --rebase && git push
